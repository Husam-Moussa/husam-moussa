name: Update profile art

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest contribution data
        run: |
          curl -sL "https://github-contributions-api.jogruber.de/v4/husam-moussa?y=last" -o scripts/contrib.json

      - name: Ensure avatar is PNG
        run: |
          if ! file scripts/avatar.png | grep -q "PNG"; then
            sudo apt-get install -y imagemagick >/dev/null
            convert scripts/avatar.png scripts/avatar_conv.png
            mv scripts/avatar_conv.png scripts/avatar.png
          fi

      - name: Regenerate SVG art
        run: |
          node scripts/make_ascii_svg.js
          node scripts/make_info_card.js
          node scripts/make_heatmap.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add husam-ascii.svg info-card.svg contrib-heatmap.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile art with latest contribution data"
            git push
          fi
